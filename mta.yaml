
_schema-version: 3.3.0
ID: purchase-request-backend
version: 1.0.0
description: "Purchase Request Management - SAP CAP"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: purchase-request-backend-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: purchase-request-backend-auth
      - name: purchase-request-backend-db

  - name: purchase-request-backend-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: purchase-request-backend-db

resources:
  - name: purchase-request-backend-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: purchase-request-backend-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'Requester (purchase-request-backend ${org}-${space})'
            description: 'Requester role collection'
            role-template-references:
              - '$XSAPPNAME.Requester'
          - name: 'Approver (purchase-request-backend ${org}-${space})'
            description: 'Approver role collection'
            role-template-references:
              - '$XSAPPNAME.Approver'

  - name: purchase-request-backend-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
